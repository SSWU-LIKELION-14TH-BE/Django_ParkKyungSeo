{% extends 'base.html' %}

{% block title %}홈 화면{% endblock %} 

{% block content %}
    <h2>Home</h2>
    {% if user.is_authenticated %}
        <p><strong>{{ user.username }}</strong>님, 환영합니다!</p>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="main-btn secondary">로그아웃</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}"><button class="main-btn">로그인</button></a>
        <div style="height: 15px;"></div>
        <a href="{% url 'signup' %}"><button class="main-btn secondary">회원가입</button></a>
    {% endif %}
{% endblock %}
