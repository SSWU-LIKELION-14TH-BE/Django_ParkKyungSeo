{% extends 'base.html' %}
{% block content %}
    <h2>Home</h2>
    {% if user.is_authenticated %}
        <p><strong>{{ user.nickname }}</strong>님, 환영합니다!</p>
        
        <div style="margin: 20px 0;">
            <a href="{% url 'post_list' %}">
                <button class="main-btn">게시물 둘러보기</button>
            </a>
            <div style="height: 10px;"></div>
            <a href="{% url 'post_create' %}">
                <button class="main-btn secondary">게시물 작성</button>
            </a>
        </div>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; color: #888; text-decoration: underline; cursor: pointer;">로그아웃</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}"><button class="main-btn">로그인</button></a>
        <div style="height: 15px;"></div>
        <a href="{% url 'signup' %}"><button class="main-btn secondary">회원가입</button></a>
    {% endif %}
{% endblock %}
