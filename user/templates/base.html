{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}서비스명{% endblock %}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_head %}{% endblock %}
</head>

<body>
    <header class="main-header"
        style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
        <div class="nav-left" style="display: flex; align-items: center; gap: 25px;">

            <a href="{% url 'home' %}" class="home-link"
                style="text-decoration: none; color: #333; display: flex; align-items: center; gap: 8px;">

                <i class="fas fa-home"></i> <span>Home</span>

            </a>

            {% if user.is_authenticated %}

            <a href="{% url 'mypage' %}" class="nav-item"
                style="text-decoration: none; color: #333; display: flex; align-items: center; gap: 8px;">

                <i class="fas fa-user-circle"></i> <span>마이페이지</span>

            </a>

            {% endif %}

            <a href="{% url 'post_list' %}" class="nav-item"
                style="text-decoration: none; color: #333; display: flex; align-items: center; gap: 8px;">

                <i class="fas fa-list"></i> <span>게시물 목록</span>

            </a>

        </div>



        <div class="nav-right" style="display: flex; align-items: center;">

            {% if user.is_authenticated %}

            <a href="{% url 'post_create' %}" class="nav-item"
                style="text-decoration: none; color: #007bff; font-weight: bold; display: flex; align-items: center; gap: 8px;">

                <i class="fas fa-pen"></i> <span>글쓰기</span>

            </a>

            {% endif %}

        </div>
    </header>


    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% if messages %}
    <script>
        {% for message in messages %}
        alert("{{ message }}");
        {% endfor %}
    </script>
    {% endif %}

</body>

</html>
