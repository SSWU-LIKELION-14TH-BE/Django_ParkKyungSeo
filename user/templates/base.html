{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}서비스명{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="main-header">
    <div class="nav-left">
        <a href="{% url 'home' %}" class="home-link">
            <i class="fas fa-home"></i> <span>Home</span>
        </a>
        <a href="{% url 'post_list' %}" class="nav-item" style="margin-left: 20px; text-decoration: none; color: #333;">
            <i class="fas fa-list"></i> 게시물 목록
        </a>
    </div>
    <div class="nav-right">
        {% if user.is_authenticated %}
            <a href="{% url 'post_create' %}" class="nav-item" style="margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold;">
                <i class="fas fa-pen"></i> 글쓰기
            </a>
        {% endif %}
    </div>
</header>


    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
