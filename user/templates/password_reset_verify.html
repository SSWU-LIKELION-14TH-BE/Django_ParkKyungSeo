<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 인증</title>
</head>

<body>
    <h2>비밀번호 재설정</h2>
    <p>이메일로 발송된 6자리 인증번호와 새 비밀번호를 입력해주세요.</p>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'password_reset_confirm' %}">
        {% csrf_token %}
        <div>
            <label>인증번호:</label>
            <input type="text" name="auth_code" placeholder="6자리 숫자" required>
        </div>
        <br>
        <div>
            <label>새 비밀번호:</label>
            <input type="password" name="new_password" placeholder="새 비밀번호 입력" required>
        </div>
        <br>
        <button type="submit">비밀번호 변경하기</button>
    </form>
</body>

</html>
