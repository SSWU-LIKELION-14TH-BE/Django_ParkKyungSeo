{% extends 'base.html' %}

{% block title %}비밀번호 재설정 인증{% endblock %}

{% block content %}
    <h2>비밀번호 재설정</h2>
    <p style="font-size: 0.9em; color: #888;">이메일로 발송된 6자리 인증번호와 새 비밀번호를 입력해주세요.</p>

    {% if error %}
    <p style="color: #ff6b6b; font-size: 0.9em;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'password_reset_verify' %}">
        {% csrf_token %}
        <input type="text" name="auth_code" placeholder="인증번호 6자리" required>
        <input type="password" name="new_password" placeholder="새 비밀번호 입력" required>
        <input type="password" name="confirm_password" placeholder="새 비밀번호 재확인" required>
        
        <button type="submit" class="main-btn">비밀번호 변경하기</button>

    </form>

    

    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

    <div class="helper-links">
        <a href="{% url 'login' %}">로그인 화면으로 돌아가기</a>
    </div>
{% endblock %}
