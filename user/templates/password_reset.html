{% extends 'base.html' %}
{% block title %}비밀번호 재설정{% endblock %}
{% block content %}
    <h2>비밀번호 재설정</h2>
    <p style="font-size: 0.9em; color: #888;">아이디와 등록된 이메일을 입력해주세요.</p>

    {% if error %}
        <p style="color: #ff6b6b; font-size: 0.9em;">{{ error }}</p>
    {% endif %}

<form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
        <input type="text" name="username" placeholder="아이디(ID)" required style="width: 100%; padding: 10px;">
    </div>
    <div style="margin-bottom: 15px;">
        <input type="email" name="email" placeholder="등록된 이메일" required style="width: 100%; padding: 10px;">
    </div>
    <button type="submit" class="main-btn" style="width: 100%;">인증번호 발송</button>
</form>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

    <div class="helper-links">
        <a href="{% url 'login' %}">로그인 화면으로 돌아가기</a>
    </div>
{% endblock %}
