<h2>비밀번호 재설정 (1단계: 이메일 인증)</h2>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post" action="{% url 'password_reset' %}">
    {% csrf_token %}
    <div>
        <label for="email">등록된 이메일 주소:</label>
        <input type="email" name="email" id="email" required placeholder="example@gmail.com">
    </div>
    <br>
    <button type="submit">인증번호 받기</button>
</form>

<hr>
<a href="{% url 'login' %}">로그인 화면으로 돌아가기</a>
