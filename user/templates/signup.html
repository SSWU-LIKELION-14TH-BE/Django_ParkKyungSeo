{% extends 'base.html' %}

{% block title %}회원가입{% endblock %}

{% block content %}
    <h2>회원가입</h2>
    <p style="font-size: 0.9em; color: #888; margin-bottom: 20px;">
        새로운 시작을 환영합니다!
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="auth-form-fields">
            {% if form.errors %}
            <div style="color: #ff6b6b; font-size: 0.85em; margin-bottom: 10px; text-align: left;">
                입력 정보를 다시 확인해주세요.
            </div>
            {% endif %}

            {{ form.as_p }}
        </div>

        <button type="submit" class="main-btn">가입하기</button>
    </form>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

    {% if not user.is_authenticated %}
    <div class="helper-links">
        <span>이미 계정이 있으신가요?</span>
        <a href="{% url 'login' %}" style="font-weight: bold; margin-left: 5px;">로그인하기</a>
    </div>
    {% endif %}
{% endblock %}
